<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tree Health Scanner Demo</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f0; }
  h1 { font-size: 22px; }
  p { color: #555; }
  .samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0; }
  button { padding: 16px 8px; border: 1px solid #ccc; border-radius: 10px; background: white; cursor: pointer; font-size: 14px; }
  button:hover { background: #eee; }
  #result { background: #eee; border-radius: 10px; padding: 24px; text-align: center; min-height: 100px; margin-top: 20px; }
  .healthy { color: #2e7d32; font-weight: bold; font-size: 20px; }
  .dead { color: #c62828; font-weight: bold; font-size: 20px; }
  .details { font-size: 13px; color: #777; margin-top: 8px; }
</style>
</head>
<body>

<h1>🌳 Tree Health Scanner — Live Demo</h1>
<p>This simulates real scans from our thermal imaging tree scanner. Select a sample to see how the device classifies it.</p>

<div class="samples" id="samples"></div>
<div id="result">Select a sample to scan</div>

<p style="margin-top:30px; font-size:13px;">Built with a Raspberry Pi 5 and MLX90640 thermal camera for Project Invent.
<a href="https://github.com/DaWinner395/tree-health-scanner">View source code on GitHub</a></p>

<script>
const samples = [
  { name: "Healthy oak", avgTemp: 24.8, variance: 3.7 },
  { name: "Healthy maple", avgTemp: 23.1, variance: 2.9 },
  { name: "Stressed pine", avgTemp: 21.6, variance: 1.1 },
  { name: "Dead branch", avgTemp: 19.4, variance: 0.4 },
  { name: "Dead trunk", avgTemp: 18.9, variance: 0.2 }
];
const THRESHOLD = 0.08;

const container = document.getElementById("samples");
samples.forEach(s => {
  const btn = document.createElement("button");
  btn.textContent = s.name;
  btn.onclick = () => scan(s);
  container.appendChild(btn);
});

function scan(s) {
  const result = document.getElementById("result");
  result.innerHTML = "Scanning " + s.name + "...";
  setTimeout(() => {
    const relVar = (s.variance / s.avgTemp).toFixed(4);
    const isDead = relVar < THRESHOLD;
    result.innerHTML = `
      <div class="${isDead ? 'dead' : 'healthy'}">${isDead ? "DEAD / DORMANT TREE" : "HEALTHY TREE"}</div>
      <div class="details">Avg temp: ${s.avgTemp.toFixed(1)}°C &nbsp;|&nbsp; Relative variance: ${relVar}</div>
    `;
  }, 800);
}
</script>

</body>
</html>
